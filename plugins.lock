# Plugins installed at user scope on every machine and cloud VM, for plugins that are
# not enabled on your claude.ai account. Plugins are never committed to project
# repositories. A plugin for one project goes in ENV_PLUGINS in that project's
# cloud environment setup script.
# Format: plugin@marketplace  marketplace-source (owner/repo or git URL)
# Third-party plugins are listed in claude-setup's own marketplace (.claude-plugin/marketplace.json) with an
# exact commit sha, and installed from there, so a VM build never picks up an unreviewed upstream change.
#
# GSD Core: the build methodology (discuss, plan, execute, verify, ship), one phase per Linear issue.
# State lives in each repository's .planning/, which is committed. Published plugin, not the next branch; pinned in marketplace.json.
gsd-core@claude-setup harry-burton-dev/claude-setup

# Outer-Pale dev-ops: Linear issues, projects and initiatives in the Outer-Pale workspace, one PR per issue. Needs Node 18+.
outerpale-devops@outerpale harry-burton-dev/outerpale-devops

# Session start work for every repository: fetches its project CLAUDE.md from projects/. Kept in this repository.
outerpale-startup@claude-setup harry-burton-dev/claude-setup

# Magister: a background second perspective at design, UI and decision moments; findings go to OneDrive Claude/magister/. Kept in this repository.
magister@claude-setup harry-burton-dev/claude-setup

# magister-avatar: a mod. In the desktop app's side pane, Magister's avatar shows while it runs; its report reaches the session as the finding's link only. Kept in this repository.
magister-avatar@claude-setup harry-burton-dev/claude-setup

# outerpale-mem: each repository's memory in OneDrive Claude/memory/<repo>/, loaded at session start, consolidated by a nightly dream. Kept in this repository.
outerpale-mem@claude-setup harry-burton-dev/claude-setup

# outerpale-mem-global: global memory every session shares (OneDrive Claude/memory/_global/). Kept in this repository; leave it out to keep a machine's sessions without it.
outerpale-mem-global@claude-setup harry-burton-dev/claude-setup

# JiT: just-in-time catching tests before every PR, in every repository (docs/design/jit-testing.md). Kept in this repository.
jit@claude-setup harry-burton-dev/claude-setup

# Langfuse observability: a Stop/SessionEnd hook that sends each turn's prompt, model output and tool calls to Harry's self-hosted Langfuse. Published by Langfuse; pinned in marketplace.json.
# Config comes from environment variables (they win over the plugin's setup wizard): LANGFUSE_BASE_URL, placeholder LANGFUSE_PUBLIC_KEY/SECRET_KEY
# in cloud (the proxy injects the real Basic auth as a network secret) and CC_LANGFUSE_CAPTURE_IMAGES=false (the Funnel exposes only /api/public/otel).
langfuse-observability@claude-setup harry-burton-dev/claude-setup
